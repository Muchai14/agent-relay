apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-relay
resources:
  - namespace.yaml
  - postgres.yaml
  - api.yaml
secretGenerator:
  - name: postgres-credentials
    literals:
      - POSTGRES_USER=relay
      - POSTGRES_PASSWORD=relay-local-only
      - POSTGRES_DB=relay
      - RELAY_DATABASE_URL=postgresql+psycopg://relay:relay-local-only@postgres:5432/relay

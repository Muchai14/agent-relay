name: Test, build, and deploy locally
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_FROZEN: 'true'
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        if: ${{ !env.ACT }}
        with:
          version: '0.12.17'
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Test protocol and live API against PostgreSQL
        run: bash scripts/ci-test.sh
      - name: Build a uniquely tagged image
        id: image
        shell: bash
        run: |
          tag="ci-$(git rev-parse --short HEAD)-$(uv run python -c 'import uuid; print(uuid.uuid4().hex[:12])')"
          docker build -t "agent-relay:$tag" .
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Load image and deploy to local kind
        if: ${{ success() && env.ACT == 'true' }}
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: bash scripts/ci-deploy.sh
